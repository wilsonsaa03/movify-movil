<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="pantalla" #pantalla>
    <!-- Cielo con saludo -->
    <header class="cielo" #cielo>
      <div class="sol" aria-hidden="true"></div>
      <svg class="gaviotas" viewBox="0 0 70 26" aria-hidden="true">
        <path d="M2 12q6-8 12 0q6-8 12 0" />
        <path class="lejos" d="M40 20q5-6 10 0q5-6 10 0" />
      </svg>

      <!-- La foto y el saludo abren el perfil (datos, foto, lugares, clave…) -->
      <button type="button" class="saludo entra" aria-label="Abrir mi perfil y configuración" (click)="abrirPerfil()">
        <span class="avatar">
          @if (foto(); as f) {
            <img [src]="f" alt="" />
          } @else {
            {{ inicial() }}
          }
        </span>
        <span class="textos">
          <small>{{ saludo() }}</small>
          <b>{{ nombre() }}</b>
        </span>
      </button>

      <button type="button" class="campana entra" style="--d: 60ms" aria-label="Notificaciones" (click)="notificaciones()">
        <app-icono nombre="campana" />
        <span class="aviso" aria-hidden="true"></span>
      </button>

      <div class="olas" aria-hidden="true">
        <svg class="ola o1" viewBox="0 0 804 140" preserveAspectRatio="none"><path d="M0 50C67 20 134 20 201 50S335 80 402 50S536 20 603 50S737 80 804 50V140H0Z" /></svg>
        <svg class="ola o2" viewBox="0 0 804 140" preserveAspectRatio="none"><path d="M0 50C67 20 134 20 201 50S335 80 402 50S536 20 603 50S737 80 804 50V140H0Z" /></svg>
      </div>
    </header>

    <!-- Mapa en tiempo real: ocupa el resto de la pantalla; la hoja se monta encima -->
    <section class="mapa" aria-label="Tu ubicación">
      <app-mapa-ciudad marcador="usuario" [centro]="miPunto()" [precision]="precision()" [margenInferior]="altoVisibleHoja()" />
      <button type="button" class="ubicacion entra" style="--d: 100ms" aria-live="polite" (click)="reubicar()">
        @if (buscandoLugar()) {
          <span class="cargando" aria-hidden="true"></span>
        } @else {
          <app-icono nombre="pin" />
        }
        <span class="lugar-textos">
          <b>{{ lugarTitulo() }}</b>
          @if (lugarDetalle()) {
            <small>{{ lugarDetalle() }}</small>
          }
        </span>
      </button>
    </section>

    <!-- Hoja de servicios: se arrastra hacia arriba/abajo (o se toca la barrita) -->
    <div
      class="envoltura"
      [class.arrastrando]="arrastrando()"
      [class.sin-medir]="!medida()"
      [style.transform]="'translateY(' + desplazamiento() + 'px)'"
    >
      <button type="button" class="centrar" aria-label="Centrar el mapa en mi ubicación" (click)="reubicar()">
        <app-icono nombre="navegar" />
      </button>

      <main class="hoja" #hoja [class.abierta]="abierta()" [style.max-height.px]="altoMaximo()">
        <div class="agarre" #agarre>
          <button
            type="button"
            class="asa"
            [attr.aria-label]="abierta() ? 'Ocultar servicios' : 'Mostrar servicios'"
            [attr.aria-expanded]="abierta()"
            (click)="alternarHoja()"
          >
            <span></span>
          </button>
          <h1 class="entra" style="--d: 140ms">¿Qué necesitas hoy, {{ nombre() }}?</h1>
          <p class="sub entra" style="--d: 170ms">Elige un servicio para empezar.</p>
        </div>

        <!-- Solo con la hoja abajo: al tocarlo la hoja sube y el botón se recoge -->
        <div class="boton-viaje" #botonViaje [class.oculto]="abierta()" [attr.inert]="abierta() ? '' : null">
          <div>
            <button type="button" class="mv-boton mv-boton--naranja hacer-viaje entra" style="--d: 190ms" (click)="hacerViaje()">
              Hacer viaje
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </button>
          </div>
        </div>

        <div class="resto" [attr.aria-hidden]="!abierta()" [attr.inert]="abierta() ? null : ''">
          <div class="servicios">
            @for (s of servicios; track s.id; let i = $index) {
              <button type="button" class="servicio entra" [class]="s.id" [style.--d]="220 + i * 50 + 'ms'" (click)="elegir(s.id)">
                <span class="baldosa"><app-icono [nombre]="s.icono" /></span>
                <b>{{ s.nombre }}</b>
                <small>{{ s.detalle }}</small>
              </button>
            }
          </div>

          <h2 class="rotulo entra" style="--d: 420ms">Tus lugares</h2>
          <div class="lugares entra" style="--d: 450ms">
            @for (l of lugares(); track l.etiqueta) {
              <button type="button" class="lugar" [class.nuevo]="l.id === null" [class]="l.icono" (click)="irALugar(l)">
                <span class="disco"><app-icono [nombre]="l.icono" /></span>
                {{ l.etiqueta }}
                @if (l.id === null) {
                  <span class="mas" aria-label="(agregar)">+</span>
                }
              </button>
            }
          </div>
        </div>
      </main>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <app-barra-inferior [items]="barra" activa="/cliente" />
</ion-footer>

<ion-content [fullscreen]="true">
  <div class="pantalla">
    <header class="cielo">
      <div class="sol" aria-hidden="true"></div>
      <svg class="gaviotas" viewBox="0 0 70 26" aria-hidden="true"><path d="M2 12q6-8 12 0q6-8 12 0" /><path class="lejos" d="M40 20q5-6 10 0q5-6 10 0" /></svg>
      <button type="button" class="volver" aria-label="Volver" (click)="volver()"><app-icono nombre="atras" /></button>
      <h1>{{ titulo() }}</h1>
      <p>{{ ayuda() }}</p>
      <div class="olas" aria-hidden="true">
        <svg class="ola o1" viewBox="0 0 804 140" preserveAspectRatio="none"><path d="M0 50C67 20 134 20 201 50S335 80 402 50S536 20 603 50S737 80 804 50V140H0Z" /></svg>
        <svg class="ola o2" viewBox="0 0 804 140" preserveAspectRatio="none"><path d="M0 50C67 20 134 20 201 50S335 80 402 50S536 20 603 50S737 80 804 50V140H0Z" /></svg>
      </div>
    </header>

    <main class="cuerpo">
      <div class="casillas" [class.mal]="!!error()" role="group" [attr.aria-label]="'PIN: ' + pin().length + ' de 4 dígitos'">
        @for (c of casillas(); track $index) {
          <span class="casilla" [class.llena]="!!c" [class.actual]="$index === pin().length">{{ c }}</span>
        }
      </div>
      <p class="estado" aria-live="polite">
        @if (error()) {
          <span class="mal"><app-icono nombre="x" /> {{ error() }}</span>
        } @else if (completo()) {
          <span class="ok"><app-icono nombre="check" /> Listo, toca {{ entrega() ? '"Entregar"' : '"Iniciar viaje"' }}</span>
        } @else {
          <span>Escribe los 4 dígitos</span>
        }
      </p>

      <app-teclado-numerico [deshabilitado]="enviando()" (digito)="digito($event)" (borrar)="borrar()" />

      @if (!entrega()) {
        <div class="espera">
          <button type="button" class="chip" (click)="chat()"><app-icono nombre="mensaje" /> Escribirle</button>
          @if (espera(); as e) {
            <button type="button" class="chip rojo" [disabled]="!e.cumplida || cancelando()" (click)="noLlego()">
              <app-icono nombre="reloj" />
              {{ e.cumplida ? 'El pasajero no llegó' : 'Esperas ' + e.reloj }}
            </button>
          }
        </div>
      }
    </main>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="pie">
    <button type="button" class="mv-boton mv-boton--naranja" [disabled]="!completo() || enviando()" (click)="confirmar()">
      @if (enviando()) {
        <span class="cargando" aria-hidden="true"></span> Revisando…
      } @else {
        {{ entrega() ? 'Entregar paquete' : 'Iniciar viaje' }}
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      }
    </button>
  </div>
</ion-footer>

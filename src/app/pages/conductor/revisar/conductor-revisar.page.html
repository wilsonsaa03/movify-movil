<ion-content [fullscreen]="true">
  <div class="pantalla">
    <app-hero-cielo
      [etiqueta]="etiqueta()"
      [paso]="5"
      [total]="5"
      titulo="Revisa y envía"
      subtitulo="Confirma que todo esté bien."
      volverA="/conductor/documentos"
    />

    <main class="cuerpo">
      <ul class="resumen">
        @for (f of filas(); track f.titulo; let i = $index) {
          <li class="item entra" [class.pendiente]="!f.listo" [style.--d]="80 + i * 50 + 'ms'">
            <span class="marca" aria-hidden="true">
              @if (f.listo) {
                <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              } @else {
                <svg viewBox="0 0 24 24"><path d="M12 7v6M12 16.5v.5" /></svg>
              }
            </span>
            <span class="textos">
              <b>{{ f.titulo }}</b>
              <small>{{ f.detalle }}</small>
            </span>
            @if (f.editar) {
              <button type="button" class="editar" (click)="editar(f.editar)" [attr.aria-label]="'Editar ' + f.titulo">
                {{ f.listo ? 'Editar' : 'Completar' }}
              </button>
            }
          </li>
        }
      </ul>

      <label class="casilla entra" style="--d: 340ms" [class.con-error]="intento() && !acepta()">
        <input type="checkbox" [checked]="acepta()" (change)="acepta.set($any($event.target).checked)" />
        <span class="cuadro" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span>
        <span>
          Confirmo que la información es real y acepto las
          <a href="https://movify.ds2.eleueleo.com/legal/condiciones-conductor-v1.pdf" target="_blank" rel="noopener">condiciones para conductores</a>.
        </span>
      </label>
      @if (intento() && !acepta()) {
        <p class="ayuda error">Debes confirmar para enviar tu solicitud.</p>
      }

      @if (error()) {
        <p class="aviso-error" role="alert">{{ error() }}</p>
      }

      <div class="final">
        <button type="button" class="mv-boton mv-boton--naranja entra" style="--d: 380ms" [disabled]="enviando()" (click)="enviar()">
          @if (enviando()) {
            <span class="cargando" aria-hidden="true"></span> Enviando…
          } @else {
            Enviar solicitud
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          }
        </button>
      </div>
    </main>
  </div>
</ion-content>

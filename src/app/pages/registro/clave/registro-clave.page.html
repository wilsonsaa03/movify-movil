<ion-content [fullscreen]="true">
  <div class="pantalla">
    <app-hero-cielo [titulo]="titulo()" [subtitulo]="subtitulo()" [paso]="4" volverA="/registro/datos" />

    <main class="cuerpo">
      <div class="zona-clave entra" style="--d: 120ms">
        <app-puntos-clave [cantidad]="clave().length" [error]="!!error()" [sacudir]="sacudir()" />

        <p class="estado" aria-live="polite">
          @if (creando()) {
            <span class="creando"><span class="cargando" aria-hidden="true"></span> Creando tu cuenta…</span>
          } @else if (error()) {
            <span class="ayuda error">{{ error() }}</span>
          } @else if (fase() === 'crear') {
            <span class="pista">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
              Evita 1234 o tu fecha de nacimiento
            </span>
          }
        </p>
      </div>

      <div class="final">
        <app-teclado-numerico class="entra" style="--d: 180ms" [deshabilitado]="creando()" (digito)="agregar($event)" (borrar)="quitar()" />

        <button type="button" class="mv-boton mv-boton--naranja" [disabled]="!completa() || creando()" (click)="siguiente()">
          {{ fase() === 'crear' ? 'Crear clave' : 'Confirmar clave' }}
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </div>
    </main>
  </div>
</ion-content>
